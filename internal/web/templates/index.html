<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内网共享打印服务平台 (PrintSvr)</title>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖨️</text></svg>">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="navbar">
    <div class="nav-brand">
      <div class="brand-icon">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/>
        </svg>
      </div>
      <span class="site-title-text">PrintSvr 共享打印系统</span>
    </div>

    <!-- 动态导航 Tabs -->
    <div class="nav-tabs" id="nav-tabs-container">
      <!-- 由 JS 动态渲染 -->
    </div>

    <!-- 用户信息与快捷切换区 -->
    <div class="nav-user" id="nav-user-area">
      <!-- 由 JS 动态渲染 -->
    </div>
  </header>

  <!-- 主体工作区 -->
  <main class="main-container" id="app-main" style="display: none;">
    <!-- 系统公告栏 -->
    <div class="announcement-bar">
      <span>📢</span>
      <span id="announcement-text">欢迎使用内网共享打印服务平台！</span>
    </div>

    <!-- 动态视图挂载点 -->
    <div id="view-content-area"></div>
  </main>

  <!-- 登录 / 注册模态框 -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal-content">
      <div class="card-header">
        <h3 class="card-title" id="auth-modal-title">🔐 欢迎登录局域网共享打印平台</h3>
      </div>

      <form onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" id="auth-username" class="form-control" placeholder="请输入用户名" required />
        </div>
        <div class="form-group">
          <label class="form-label">登录密码</label>
          <input type="password" id="auth-password" class="form-control" placeholder="请输入密码" required />
        </div>

        <!-- 注册专属字段 -->
        <div class="form-group register-only" style="display: none;">
          <label class="form-label">您的姓名 / 显示名</label>
          <input type="text" id="auth-displayname" class="form-control" placeholder="例: 张三" />
        </div>
        <div class="form-group register-only" style="display: none;">
          <label class="form-label">所属部门 / 办公室</label>
          <input type="text" id="auth-department" class="form-control" placeholder="例: 技术部 / 综合办" />
        </div>

        <button type="submit" class="btn btn-primary" id="auth-submit-btn" style="width: 100%; padding: 0.75rem;">
          立即登录
        </button>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; font-size: 0.85rem;">
          <span id="auth-switch-tip">还没有账号？<a href="javascript:void(0)" onclick="showAuthModal('register')">点击自主注册</a></span>
        </div>

        <!-- 快捷测试账号卡片 (可由后台系统设置开关控制显示) -->
        <div id="demo-accounts-card" style="margin-top: 1.25rem; padding: 0.75rem; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; font-size: 0.8rem;">
          <div style="font-weight: 600; color: #475569; margin-bottom: 0.35rem;">💡 局域网开箱体验测试账号 (点击一键填入)：</div>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button type="button" class="btn btn-sm btn-outline" onclick="fillDemoAccount('admin', 'admin123')">
              👑 管理员 (admin / admin123)
            </button>
            <button type="button" class="btn btn-sm btn-outline" onclick="fillDemoAccount('demo', '123456')">
              👤 普通用户 (demo / 123456)
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 通用动态模态框 -->
  <div class="modal-overlay" id="general-modal">
    <div class="modal-content" id="general-modal-body"></div>
  </div>

  <!-- 全局 Toast 容器 -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/static/app.js"></script>
</body>
</html>
